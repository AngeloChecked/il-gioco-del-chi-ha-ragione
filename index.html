<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chi ha ragione?</title>
<meta name="description" content="Il tribunale del marciapiede: liti da spazio pubblico, voti su piani separati, lenti dei personaggi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --asfalto:#2E3136; --gesso:#F7F7F2;
  --bg:var(--gesso); --fg:var(--asfalto); --surface:#FFFFFF; --muted:#5F636A; --linea:#D5D6D0;
  --blu:#1F4E9C; --blu-pulsante:#1F4E9C; --giallo:#F2C230; --rosso:#C8322B; --verde:#3F8F5B; --verde-testo:#2F6E45; --rosso-testo:#B02A24;
  --font-titoli:"Bricolage Grotesque", system-ui, sans-serif;
  --font-testo:"Atkinson Hyperlegible", system-ui, sans-serif;
  --raggio:12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:var(--asfalto); --fg:var(--gesso); --surface:#3A3E44; --muted:#B4B8BE; --linea:#555A62;
    --blu:#7FA6F2; --blu-pulsante:#2F62C0; --giallo:#F5CD4E; --rosso:#E5544C; --verde:#5DB37A; --verde-testo:#6FC28B; --rosso-testo:#FF9B94;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:var(--asfalto); --fg:var(--gesso); --surface:#3A3E44; --muted:#B4B8BE; --linea:#555A62;
  --blu:#7FA6F2; --blu-pulsante:#2F62C0; --giallo:#F5CD4E; --rosso:#E5544C; --verde:#5DB37A; --verde-testo:#6FC28B; --rosso-testo:#FF9B94;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 var(--font-testo); overflow-x: hidden; }
h2, h3 { font-family: var(--font-titoli); line-height: 1.15; margin: 0 0 8px; }
h2 { font-size: 22px; font-weight: 700; }
h3 { font-size: 18px; font-weight: 700; }
p { margin: 0 0 8px; }
a { color: var(--blu); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.salta { position: absolute; left: -999px; top: 8px; background: var(--giallo); color: var(--asfalto); padding: 8px 12px; z-index: 10; }
.salta:focus { left: 8px; }
:is(a, button, select, input, textarea, summary, [tabindex]):focus-visible { outline: 3px solid var(--giallo); outline-offset: 2px; }
main:focus, .finale:focus { outline: none; }

header.top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; padding: 16px 24px; max-width: 1248px; margin: 0 auto; }
.brand h1 { font: 800 32px/1.05 var(--font-titoli); margin: 0; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
nav.modi { display: flex; flex-wrap: wrap; gap: 4px; }
nav.modi a { font: 700 15px var(--font-testo); color: var(--fg); text-decoration: none; padding: 6px 12px; border-radius: 999px; box-shadow: inset 0 0 0 2px transparent; }
nav.modi a:hover { box-shadow: inset 0 0 0 2px var(--linea); }
nav.modi a[aria-current="page"] { box-shadow: inset 0 0 0 2px var(--fg); }
.azioni-top { display: flex; gap: 8px; align-items: center; }

.btn { font: 700 17px var(--font-titoli); color: #fff; background: var(--blu-pulsante); border: 0; border-radius: 8px; padding: 10px 18px; box-shadow: inset 0 0 0 2px #fff, 0 0 0 1px var(--blu-pulsante); cursor: pointer; transition: transform .15s; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; }
.btn:hover { transform: rotate(-1deg); }
.btn-sec { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 2px var(--fg); }
.btn-piccolo { font-size: 15px; padding: 6px 12px; min-height: 40px; }
.btn-grande { font-size: 20px; padding: 12px 22px; }
.btn[aria-disabled="true"], .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.freccia { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: #fff; color: var(--blu-pulsante); font-size: 18px; }
.btn small { display: block; font: 400 12px var(--font-testo); opacity: .9; }

main.layout { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 24px; padding: 0 24px 40px; max-width: 1248px; margin: 0 auto; }
main.layout.senza-semaforo { grid-template-columns: minmax(0, 1fr); }
.colonna { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.semaforo { list-style: none; margin: 0; padding: 12px 0; background: var(--asfalto); border-radius: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; align-self: start; position: sticky; top: 12px; box-shadow: inset 0 0 0 2px #1d1f22; }
.luce { width: 38px; height: 38px; border-radius: 50%; background: #454950; color: #C9CCD1; display: grid; place-items: center; font: 700 14px var(--font-testo); transition: background .3s, box-shadow .3s; }
.luce[data-accesa="true"][data-colore="verde"] { background: var(--verde); color: #10301d; }
.luce[data-accesa="true"][data-colore="giallo"] { background: var(--giallo); color: var(--asfalto); }
.luce[data-accesa="true"][data-colore="rosso"] { background: var(--rosso); color: #fff; }
.luce.corrente { box-shadow: 0 0 0 3px #fff, 0 0 18px 4px rgba(255,255,255,.35); }
.luce.cede { background: var(--verde) !important; color: #10301d !important; box-shadow: 0 0 0 3px #fff, 0 0 22px 6px var(--verde); }

.intestazione-scena { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
.intestazione-scena h2 { margin: 0; }
.seed { font: 700 14px var(--font-testo); color: var(--muted); }
.seed button { font: inherit; color: var(--blu); background: none; border: 0; padding: 4px; cursor: pointer; text-decoration: underline; }

.scena-box { position: relative; border-radius: var(--raggio); overflow: hidden; background: #DDE5E0; box-shadow: inset 0 0 0 3px var(--asfalto); }
.scena-svg { position: relative; aspect-ratio: 2 / 1; }
.scena-svg svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.fumetti { position: absolute; inset: 0; pointer-events: none; }
.fumetto-pos { position: absolute; width: max-content; max-width: min(36%, 300px); transform: var(--tx, none); }
.fumetto-pos.narr { left: 2%; top: 3%; max-width: 50%; }
.fumetto { position: relative; background: #fff; color: #2E3136; border: 3px solid #2E3136; border-radius: 18px; padding: 8px 14px; font: 600 17px/1.25 var(--font-titoli); animation: pop .22s cubic-bezier(.34,1.56,.64,1) both; }
.fumetto::after { content: ""; position: absolute; width: 14px; height: 14px; background: inherit; border-right: 3px solid #2E3136; border-bottom: 3px solid #2E3136; bottom: -9px; left: var(--coda, 30%); transform: rotate(45deg); }
.fumetto .chi { display: block; font: 700 12px var(--font-testo); text-transform: uppercase; letter-spacing: .04em; color: #5F636A; }
.fumetto[data-tipo="narratore"] { background: var(--giallo); color: #2E3136; border-radius: 0; border-width: 0; box-shadow: 3px 3px 0 #2E3136; font-weight: 600; }
.fumetto[data-tipo="narratore"]::after, .fumetto[data-tipo="narratore"] .chi { display: none; }
.fumetto[data-tipo="urlato"] { border-color: #C8322B; border-width: 4px; font-weight: 800; text-transform: uppercase; font-size: 16px; transform: rotate(-1deg); }
.fumetto[data-tipo="urlato"]::after { border-color: #C8322B; border-width: 0 4px 4px 0; }
.fumetto[data-tipo="sussurro"] { border-style: dashed; font-style: italic; font-weight: 600; color: #4A4E55; }
.fumetto[data-tipo="sussurro"]::after { border-style: none dashed dashed none; }
.fumetto[data-tipo="pensiero"] { border-radius: 40px; font-style: italic; }
.fumetto[data-tipo="pensiero"]::after { width: 12px; height: 12px; border-radius: 50%; border: 3px solid #2E3136; bottom: -18px; transform: none; box-shadow: 10px 10px 0 -3px #fff, 10px 10px 0 0 #2E3136; }
.fumetto[data-tipo="sistema"] { border-color: #1F4E9C; border-radius: 6px; box-shadow: inset 0 0 0 2px #fff, 0 0 0 2px #1F4E9C; }
.fumetto[data-tipo="sistema"]::after { border-color: #1F4E9C; }
@keyframes pop { 0% { opacity: 0; scale: .6; } 70% { scale: 1.05; } 100% { opacity: 1; scale: 1; } }

.censura { display: inline-block; font: 800 .8em var(--font-titoli); padding: 0 6px; margin: 0 1px; border-radius: 3px; vertical-align: baseline; letter-spacing: .02em; text-transform: none; font-style: normal; }
.censura[data-intensita="1"] { background: #F2C230; color: #2E3136; }
.censura[data-intensita="2"] { background: #1B1C1F; color: #F5CD4E; }
.censura[data-intensita="3"] { background: #C8322B; color: #fff; transform: rotate(-6deg); box-shadow: 0 0 0 2px #fff, 0 0 0 4px #C8322B; animation: trema .2s 2; }
.censura.aureola { position: relative; }
.censura.aureola::before { content: ""; position: absolute; left: 20%; right: 20%; top: -7px; height: 4px; border-radius: 50%; border: 2px solid #E0A030; }
@keyframes trema { 25% { translate: -2px 0; } 75% { translate: 2px 0; } }

.variabili { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.chip { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; padding: 4px 10px 4px 6px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--linea); }
.chip svg { width: 20px; height: 20px; flex: none; }
.chip .nome { color: var(--muted); }

.scheda { background: var(--surface); border-radius: var(--raggio); padding: 20px; border-left: 6px solid var(--col-livello, var(--verde)); }
.scheda[data-colore="verde"] { --col-livello: var(--verde); }
.scheda[data-colore="giallo"] { --col-livello: var(--giallo); }
.scheda[data-colore="rosso"] { --col-livello: var(--rosso); }
.domanda { border: 0; padding: 0; margin: 0 0 20px; min-width: 0; }
.domanda legend { font: 700 18px var(--font-testo); margin-bottom: 10px; padding: 0; }
.opzioni { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 8px; }
.opzione-col { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.opzione { min-height: 44px; border-radius: 10px; border: 2px solid var(--fg); background: transparent; color: var(--fg); font: 700 16px var(--font-testo); cursor: pointer; padding: 6px; overflow-wrap: anywhere; }
.opzione:hover { background: color-mix(in srgb, var(--fg) 8%, transparent); }
.opzione[aria-checked="true"] { background: var(--fg); color: var(--bg); }
.opzione:disabled { cursor: default; }
.estremi { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; margin-top: 4px; }
.lenti-col { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; min-height: 36px; }
.lente { width: 34px; height: 34px; border-radius: 50%; background: color-mix(in srgb, var(--fg) 8%, transparent); display: grid; place-items: center; animation: scivola .3s ease-out both; }
.lente svg { width: 32px; height: 32px; }
@keyframes scivola { from { opacity: 0; translate: 0 -10px; } }
.tu { font: 700 12px var(--font-testo); text-align: center; color: var(--fg); }
.perche { display: grid; gap: 4px; margin-bottom: 16px; }
.perche label { font-weight: 700; }
.perche input { font: inherit; padding: 10px 12px; border-radius: 8px; border: 2px solid var(--linea); background: var(--bg); color: var(--fg); width: 100%; }
.contatore { color: var(--muted); font-size: 13px; text-align: right; }
.riga-azioni { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.legenda-lenti { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--muted); margin: 0 0 12px; padding: 0; list-style: none; }
.legenda-lenti li { display: flex; align-items: center; gap: 6px; }
.legenda-lenti svg { width: 24px; height: 24px; }
.nota { color: var(--muted); font-size: 14px; }

.intro { background: var(--surface); border-radius: var(--raggio); padding: 28px; display: grid; gap: 12px; }
.intro .cartello { display: inline-block; align-self: start; justify-self: start; background: var(--giallo); color: var(--asfalto); font: 700 17px var(--font-titoli); padding: 6px 12px; box-shadow: 3px 3px 0 var(--asfalto); }

.finale { display: grid; gap: 20px; min-width: 0; }
.finale > * { min-width: 0; }
.timbro { justify-self: start; border: 5px double var(--rosso); color: var(--rosso-testo); font: 800 28px/1.1 var(--font-titoli); letter-spacing: .08em; text-transform: uppercase; padding: 6px 16px; transform: rotate(-4deg); animation: timbro .25s ease-out both; }
@keyframes timbro { from { opacity: 0; scale: 1.4; rotate: 8deg; } }
.etichetta { font: 700 20px var(--font-titoli); }
.avviso-identita { border: 3px solid var(--rosso); padding: 14px 16px; border-radius: 10px; background: var(--surface); }
.avviso-identita strong { color: var(--rosso-testo); }
.percorso { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.percorso li { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: start; }
.percorso .n { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--linea); color: var(--fg); }
.percorso .n[data-colore="verde"] { background: var(--verde); color: #10301d; }
.percorso .n[data-colore="giallo"] { background: var(--giallo); color: var(--asfalto); }
.percorso .n[data-colore="rosso"] { background: var(--rosso); color: #fff; }
.percorso q { color: var(--muted); font-style: italic; }
.tabella-wrap { overflow-x: auto; }
table.confronto { width: 100%; border-collapse: collapse; font-size: 14px; }
table.confronto th, table.confronto td { padding: 8px 6px; border-bottom: 1px solid var(--linea); text-align: center; }
table.confronto th:first-child, table.confronto td:first-child { text-align: left; }
table.confronto td.uguale { color: var(--verde-testo); font-weight: 700; }
.somiglia { display: flex; gap: 16px; align-items: center; background: var(--surface); padding: 16px; border-radius: var(--raggio); }
.somiglia svg { width: 72px; height: 120px; flex: none; }
.pulsanti { display: flex; flex-wrap: wrap; gap: 10px; }

.griglia-2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.campi { display: grid; gap: 10px; }
.campo { display: grid; gap: 4px; }
.campo label { font-weight: 700; font-size: 15px; }
.campo select, .campo input[type="text"], .campo textarea { font: inherit; font-size: 16px; padding: 8px 10px; border-radius: 8px; border: 2px solid var(--linea); background: var(--bg); color: var(--fg); width: 100%; }
.campo textarea { min-height: 80px; resize: vertical; }
.campo[data-attiva="true"] select { border-color: var(--giallo); box-shadow: 0 0 0 2px var(--giallo); }
.campo select:disabled { opacity: .55; }
.barre { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.barre li { display: grid; grid-template-columns: minmax(0, 1fr) 120px 44px; gap: 8px; align-items: center; font-size: 15px; }
.barra { height: 12px; border-radius: 6px; background: color-mix(in srgb, var(--fg) 12%, transparent); overflow: hidden; }
.barra span { display: block; height: 100%; width: var(--v); background: var(--blu-pulsante); }
.barre b { text-align: right; font-variant-numeric: tabular-nums; }
.grafico > svg { width: 100%; height: auto; display: block; }
.grafico .legenda-lenti { margin-top: 8px; }
.grafico text { font-family: var(--font-testo); fill: var(--fg); }

.schede-pg { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.scheda-pg { display: grid; justify-items: center; gap: 4px; padding: 10px; border-radius: var(--raggio); background: var(--surface); border: 2px solid transparent; color: var(--fg); font: inherit; cursor: pointer; text-align: center; }
.scheda-pg[aria-pressed="true"] { border-color: var(--fg); }
.scheda-pg svg { width: 60px; height: 100px; }
.scheda-pg .titolo { font-size: 13px; color: var(--muted); }
.cursore { display: grid; grid-template-columns: minmax(0, 1fr) 48px; gap: 2px 8px; align-items: center; }
.cursore label { grid-column: 1 / -1; font-weight: 700; font-size: 15px; }
.cursore input[type="range"] { width: 100%; accent-color: var(--blu-pulsante); }
.cursore output { font-variant-numeric: tabular-nums; text-align: right; }
.anteprima { display: flex; gap: 8px; justify-content: center; background: #DDE5E0; border-radius: var(--raggio); padding: 8px; box-shadow: inset 0 0 0 3px var(--asfalto); }
.anteprima svg { width: 90px; height: 150px; }

.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--asfalto); color: var(--gesso); padding: 10px 16px; border-radius: 10px; box-shadow: 0 0 0 2px var(--gesso); opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100vw - 32px); overflow-wrap: anywhere; }
.toast.visibile { opacity: 1; }

@media (max-width: 900px) {
  .griglia-2 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
  header.top { padding: 12px 16px; }
  .brand h1 { font-size: 24px; }
  nav.modi a { font-size: 14px; padding: 4px 8px; }
  main.layout { grid-template-columns: minmax(0, 1fr); padding: 0 16px 32px; gap: 16px; }
  .semaforo { flex-direction: row; justify-content: center; padding: 8px; position: static; gap: 8px; border-radius: 14px; }
  .luce { width: 30px; height: 30px; font-size: 12px; }
  .scena-box { background: var(--surface); }
  .fumetti { position: static; display: flex; flex-direction: column; gap: 8px; padding: 12px; }
  .fumetto-pos, .fumetto-pos.narr { position: static; max-width: none; width: auto; transform: none; }
  .fumetto::after { display: none; }
  .fumetto { font-size: 16px; }
  .chip .nome { display: none; }
  .barre li { grid-template-columns: minmax(0, 1fr) 64px 40px; font-size: 14px; }
  .scheda { padding: 16px; }
  .opzioni { grid-template-columns: repeat(min(var(--n), 3), minmax(0, 1fr)); }
  .opzioni[data-tipo="scala"] { grid-template-columns: repeat(5, minmax(0, 1fr)); }
}
.scena-box.fumetti-sotto { background: var(--surface); }
.fumetti-sotto .fumetti { position: static; display: flex; flex-direction: column; gap: 8px; padding: 12px; }
.fumetti-sotto .fumetto-pos, .fumetti-sotto .fumetto-pos.narr { position: static; max-width: none; width: auto; transform: none; }
.fumetti-sotto .fumetto::after { display: none; }
@media (min-width: 721px) {
  .scena-box:not(.fumetti-sotto) .fumetto .chi { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<a class="salta" href="#contenuto">Vai al contenuto</a>
<header class="top">
  <div class="brand">
    <h1>Chi ha ragione?</h1>
    <p>Il tribunale del marciapiede</p>
  </div>
  <nav class="modi" aria-label="Modalità di gioco">
    <a href="#gioco" data-vista="gioco" data-testid="nav-gioco">Gioco</a>
    <a href="#laboratorio" data-vista="laboratorio" data-testid="nav-laboratorio">Laboratorio</a>
    <a href="#indovina" data-vista="indovina" data-testid="nav-indovina">Indovina la lente</a>
    <a href="#costruisci" data-vista="costruisci" data-testid="nav-costruisci">Costruisci il caso</a>
    <a href="#personaggi" data-vista="personaggi" data-testid="nav-personaggi">Personaggi</a>
  </nav>
  <div class="azioni-top">
    <button class="btn btn-sec btn-piccolo" type="button" data-azione="tema" data-testid="btn-tema" title="Cambia tema"><span aria-hidden="true">◐</span> Tema: <span data-tema-etichetta>Auto</span></button>
    <button class="btn" type="button" data-azione="nuova" data-testid="btn-nuova">Nuova grana</button>
  </div>
</header>
<main id="contenuto" class="layout" tabindex="-1"></main>
<div class="sr-only" aria-live="polite" data-testid="annunci"></div>
<div class="toast" role="status" aria-live="polite" data-testid="toast"></div>
<script id="motore">
globalThis.Motore = (() => {
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const r3 = v => Math.round(v * 1000) / 1000;
  const cap = s => (s ? s[0].toUpperCase() + s.slice(1) : s);

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const pick = (rnd, arr) => arr[Math.floor(rnd() * arr.length)];
  function pesato(rnd, items, pesi) {
    const tot = pesi.reduce((a, b) => a + b, 0);
    if (tot <= 0) return items[0];
    let r = rnd() * tot;
    for (let i = 0; i < items.length; i++) {
      r -= pesi[i];
      if (r < 0) return items[i];

  function bambino(x, s, colore = "#E0A030") {
    return `<g transform="translate(${x - 60 * s} ${380 - 200 * s}) scale(${s})">${avatar({ nome: "bambino", avatar: { corpo: 0, colore, pelle: "#F1D3B8", capelli: "#6B4A2B", taglio: "ricci" } }, { espressione: "calmo" })}</g>`;
  }

  function folla(n, viva) {
    const out = [];
    for (let i = 0; i < n; i++) {
      const x = 40 + ((i * 97) % 720);
      const y = 226 + (i % 3) * 6;
      out.push(`<g opacity="${viva ? 0.85 : 0.4}" fill="#B8BCC2" stroke="#8E949B" stroke-width="2"><circle cx="${x}" cy="${y}" r="11"/><rect x="${x - 15}" y="${y + 11}" width="30" height="38" rx="11"/></g>`);
    }
    return out.join("");
  }

  const ICONE = {
    luogo: `<path d="M12 2 C7 2 4 6 4 10 c0 6 8 12 8 12 s8 -6 8 -12 c0 -4 -3 -8 -8 -8 Z" fill="currentColor"/><circle cx="12" cy="10" r="3" fill="#fff"/>`,
    condotta: `<path d="M3 5 h18 v11 h-9 l-5 4 v-4 h-4 Z" fill="currentColor"/><path d="M8 10 h8" stroke="#fff" stroke-width="2"/>`,
    volume: `<path d="M3 9 h4 l5 -4 v14 l-5 -4 h-4 Z" fill="currentColor"/><path d="M15 8 q3 4 0 8 M18 5 q6 7 0 14" fill="none" stroke="currentColor" stroke-width="2"/>`,
    frequenza: `<path d="M5 12 a7 7 0 0 1 12 -5 l2 -2 v6 h-6 l2 -2 a4 4 0 0 0 -7 3 Z M19 12 a7 7 0 0 1 -12 5 l-2 2 v-6 h6 l-2 2 a4 4 0 0 0 7 -3 Z" fill="currentColor"/>`,
    intento: `<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/>`,
    bambini: `<circle cx="12" cy="6" r="3.5" fill="currentColor"/><path d="M7 21 v-7 a5 5 0 0 1 10 0 v7 Z" fill="currentColor"/>`,
    allontanarsi: `<path d="M5 3 h10 v18 h-10 Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 12 h9 m-3 -3 l3 3 l-3 3" fill="none" stroke="currentColor" stroke-width="2"/>`,
    terzo: `<path d="M12 2 l8 3 v6 c0 5 -4 9 -8 11 c-4 -2 -8 -6 -8 -11 v-6 Z" fill="currentColor"/><path d="M8 12 l3 3 l5 -6" fill="none" stroke="#fff" stroke-width="2"/>`,
    pubblico: `<circle cx="7" cy="8" r="3" fill="currentColor"/><circle cx="17" cy="8" r="3" fill="currentColor"/><circle cx="12" cy="6" r="3.2" fill="currentColor"/><path d="M2 20 a5 5 0 0 1 10 0 Z M12 20 a5 5 0 0 1 10 0 Z M6 18 a6 6 0 0 1 12 0 Z" fill="currentColor"/>`,
    durata: `<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7 v5 l4 2" fill="none" stroke="currentColor" stroke-width="2"/>`,
  };
  const icona = nome => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONE[nome] || ""}</svg>`;

  const SLOT = { autore: 300, osservatore: 520, amici: [190, 92], terzo: 650, via: 752 };

  function posizioni(sit, passo) {
    const pos = { [sit.autore.id]: SLOT.autore, [sit.osservatore.id]: SLOT.osservatore };
    sit.amici.forEach((a, i) => { pos[a.id] = SLOT.amici[i]; });
    for (const [id, posa] of Object.entries(passo.pose || {})) if (posa === "allontana") pos[id] = SLOT.via;
    pos.terzo = SLOT.terzo;
    pos.folla = 420;
    return pos;
  }

  function scena(sit, passo, terzoPg) {
    const L = sit.luogo, m = sit.modulatori;
    const pos = posizioni(sit, passo);
    const parti = [`<g data-testid="scena-luogo" data-luogo="${L.id}" aria-hidden="true">${(FONDALE[L.id] || FONDALE.parco)()}</g>`];
    parti.push(`<g aria-hidden="true">${folla([0, 4, 9][m.pubblico] + (passo.folla ? 3 : 0), passo.folla)}</g>`);
    const pg = [
      { p: sit.autore, ruolo: "autore", tag: "A" },
      { p: sit.osservatore, ruolo: "osservatore", tag: "B" },
      ...sit.amici.map(a => ({ p: a, ruolo: "amico" })),
    ];
    if (L.seduti && SEDILE[L.id]) {
      for (const { p } of pg) if ((passo.pose?.[p.id] || "seduto") === "seduto") parti.push(`<g aria-hidden="true">${SEDILE[L.id](pos[p.id])}</g>`);
    }
    if (m.bambini === 1) parti.push(`<g aria-hidden="true">${bambino(712, 0.42)}${bambino(770, 0.38, "#5A7FBF")}</g>`);
    if (m.bambini === 2) parti.push(`<g aria-hidden="true">${bambino(420, 0.45)}${bambino(452, 0.4, "#5A7FBF")}</g>`);
    if (sit.condotta.id === "fumare" && !passo.fine) parti.push(`<g aria-hidden="true" fill="#C9CCD1" opacity=".75"><circle cx="350" cy="200" r="14"/><circle cx="385" cy="185" r="18"/><circle cx="425" cy="190" r="16"/><circle cx="460" cy="200" r="12"/></g>`);
    if (["musica", "telefonata"].includes(sit.condotta.id) || m.volume >= 2) {
      const archi = Math.max(1, m.volume + 1);
      parti.push(`<g aria-hidden="true" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round" opacity=".7">${Array.from({ length: archi }, (_, i) => `<path d="M${352 + i * 10} ${208 - i * 6} q${8 + i * 4} ${16 + i * 6} 0 ${32 + i * 12}"/>`).join("")}</g>`);
    }
    for (const { p, ruolo, tag } of pg) {
      const x = pos[p.id];
      const posa = passo.pose?.[p.id] || "in piedi";
      const espr = passo.espressioni?.[p.id] || "calmo";
      const dir = x < 410 ? 1 : -1;
      const s = ruolo === "amico" ? 0.9 : 1;
      const ty = 380 - 200 * s;
      const nome = tag ? `${tag} · ${p.nome}` : p.nome;
      parti.push(`<g data-testid="personaggio" data-id="${esc(p.id)}" data-ruolo="${ruolo}" data-espressione="${espr}" data-posa="${posa}" role="img" aria-label="${esc((tag ? tag + ", " : "") + descrizioneAvatar(p, espr, posa))}">
        <g transform="translate(${x - 60 * s} ${ty}) scale(${s})" ${posa === "allontana" ? 'opacity=".85"' : ""}>${avatar(p, { espressione: espr, posa, dir })}</g>
        <text x="${x}" y="396" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif" font-weight="700" font-size="15" fill="${INK}" stroke="#fff" stroke-width="4" paint-order="stroke">${esc(nome)}</text></g>`);
    }
    if (passo.terzo && terzoPg) {
      const nome = sit.terzo ? sit.terzo[0].toUpperCase() + sit.terzo.slice(1) : terzoPg.nome;
      parti.push(`<g data-testid="personaggio" data-id="terzo" data-ruolo="terzo" data-espressione="calmo" data-posa="in piedi" role="img" aria-label="${esc(descrizioneAvatar({ nome }, "calmo"))}">
        <g transform="translate(${SLOT.terzo - 60} 180)">${avatar(terzoPg, { espressione: "calmo", dir: -1 })}</g>
        <text x="${SLOT.terzo}" y="396" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif" font-weight="700" font-size="15" fill="${INK}" stroke="#fff" stroke-width="4" paint-order="stroke">${esc(nome)}</text></g>`);
    }
    return `<svg viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet" role="group" aria-label="Scena: ${esc(L.nome)}" xmlns="http://www.w3.org/2000/svg">${parti.join("")}</svg>`;
  }

  return Object.freeze({ ESPRESSIONI, POSE, DISTINTIVI, TAGLI, FONDALE, SLOT, esc, avatar, avatarSVG, miniSVG, descrizioneAvatar, scena, posizioni, icona, ICONE });
})();
