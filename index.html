<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chi ha ragione?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --asfalto:#2E3136; --gesso:#F7F7F2;
  --bg:var(--gesso); --fg:var(--asfalto); --surface:#FFFFFF; --muted:#6B6F76;
  --blu:#1F4E9C; --blu-pulsante:#1F4E9C; --giallo:#F2C230; --rosso:#C8322B; --verde:#3F8F5B; --verde-testo:#2F6E45;
  --font-titoli:"Bricolage Grotesque", system-ui, sans-serif;
  --font-testo:"Atkinson Hyperlegible", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:var(--asfalto); --fg:var(--gesso); --surface:#3A3E44; --muted:#A9ADB3;
    --blu:#5B8DEF; --blu-pulsante:#2F62C0; --giallo:#F5CD4E; --rosso:#E5544C; --verde:#5DB37A; --verde-testo:#5DB37A;
  }
}
:root[data-theme="dark"] {
  --bg:var(--asfalto); --fg:var(--gesso); --surface:#3A3E44; --muted:#A9ADB3;
  --blu:#5B8DEF; --blu-pulsante:#2F62C0; --giallo:#F5CD4E; --rosso:#E5544C; --verde:#5DB37A; --verde-testo:#5DB37A;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 var(--font-testo); }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 16px 24px; }
h1 { font: 800 32px/1.1 var(--font-titoli); margin: 0; }
.btn { font: 700 17px var(--font-titoli); color: #fff; background: var(--blu-pulsante); border: 0; border-radius: 8px; padding: 10px 18px; box-shadow: inset 0 0 0 2px #fff; cursor: pointer; transition: transform .15s; }
.btn:hover { transform: rotate(-1deg); }
.btn:focus-visible { outline: 3px solid var(--giallo); outline-offset: 2px; }
main { display: grid; grid-template-columns: 72px 1fr; gap: 24px; padding: 0 24px 24px; max-width: 1200px; margin: 0 auto; }
.semaforo { list-style: none; margin: 0; padding: 12px 0; background: var(--asfalto); border-radius: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.luce { width: 36px; height: 36px; border-radius: 50%; background: #444; color: #999; display: grid; place-items: center; font: 700 13px var(--font-testo); }
.luce[data-accesa="true"] { background: var(--verde); color: #fff; box-shadow: 0 0 16px var(--verde); }
.scena { background: var(--surface); border-radius: 12px; padding: 24px; min-height: 320px; }
.didascalia { display: inline-block; background: var(--giallo); color: var(--asfalto); font: 600 17px var(--font-titoli); padding: 8px 12px; }
.seed { font: 700 13px var(--font-testo); color: var(--muted); }
@media (max-width: 720px) {
  header { padding: 16px; }
  h1 { font-size: 24px; }
  main { grid-template-columns: 1fr; padding: 0 16px 16px; }
  .semaforo { flex-direction: row; justify-content: center; padding: 8px; }
  .luce { width: 24px; height: 24px; font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header>
  <h1>Chi ha ragione?</h1>
  <button class="btn" data-testid="btn-nuova" type="button">Nuova grana</button>
</header>
<main>
  <ol class="semaforo" aria-label="Semaforo dell'escalation"></ol>
  <section class="scena" data-testid="scena" aria-live="polite">
    <p class="didascalia" data-testid="didascalia">Tutto tranquillo. Per ora.</p>
    <p class="seed" data-testid="seed"></p>
  </section>
</main>
<script id="motore">
globalThis.Motore = (() => {
  const LIVELLI = ["La scena", "Il fastidio", "La richiesta", "La risposta", "Dopo il rifiuto", "Lo scontro", "La chiusura"];
  const LUOGHI = ["Parco", "Piazza affollata", "Fermata dell'autobus", "Treno regionale", "Ristorante", "Bar", "Palestra", "Cinema", "Biblioteca", "Sagrato della chiesa", "Live in streaming"];

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function generaSituazione(seed) {
    const rnd = mulberry32(seed);
    return { seed, luogo: LUOGHI[Math.floor(rnd() * LUOGHI.length)] };
  }

  return Object.freeze({ LIVELLI, LUOGHI, mulberry32, generaSituazione });
})();
</script>
<script id="app">
const { LIVELLI, generaSituazione } = Motore;
const stato = { seed: null, situazione: null, livello: 0, storico: [], voti: [], finito: false };

function render() {
  const sem = document.querySelector(".semaforo");
  sem.innerHTML = LIVELLI.map((nome, i) =>
    `<li class="luce" data-testid="semaforo-luce" data-livello="${i}" data-accesa="${i <= stato.livello}" aria-label="Livello ${i}: ${nome}">${i}</li>`
  ).join("");
  if (!stato.situazione) return;
  document.querySelector('[data-testid="didascalia"]').textContent = `${stato.situazione.luogo}. Tutto tranquillo. Per ora.`;
  document.querySelector('[data-testid="seed"]').textContent = `Caso #s-${stato.seed}`;
}

function nuova(seed = Math.floor(Math.random() * 900000) + 100000) {
  Object.assign(stato, { seed, situazione: generaSituazione(seed), livello: 0, storico: [], voti: [], finito: false });
  if (location.hash !== `#s-${seed}`) history.replaceState(null, "", `#s-${seed}`);
  render();
}

document.querySelector('[data-testid="btn-nuova"]').addEventListener("click", () => nuova());

function daHash() {
  const m = location.hash.match(/^#s-(\d+)$/);
  if (m && +m[1] !== stato.seed) nuova(+m[1]);
  else if (!m) render();
}
addEventListener("hashchange", daHash);
daHash();

window.__CHR__ = {
  version: "0.0.1-skeleton",
  stato: () => structuredClone(stato),
  nuova,
  generaSituazione,
};
</script>
</body>
</html>
