<script id="app">
(() => {
  const M = Motore, A = Asset, esc = A.esc;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const main = $("#contenuto");

  const CHIEDI_PERCHE = false;
  const STORAGE_KEY = "chi-ha-ragione:v1";
  let memoria = {};
  const storage = {
    leggi() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const v = raw ? JSON.parse(raw) : {};
        return v && typeof v === "object" ? v : {};
      } catch {
        return { ...memoria };
      }
    },
    scrivi(dati) {
      memoria = { ...dati };
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(dati)); } catch { }
    },
    reset() {
      memoria = {};
      try { localStorage.removeItem(STORAGE_KEY); } catch { }
    },
  };
  let salvati = storage.leggi();
  const salva = patch => { salvati = { ...salvati, ...patch }; storage.scrivi(salvati); };

  const clona = x => JSON.parse(JSON.stringify(x));
  const predefiniti = () => clona(M.PERSONAGGI);
  function personaggiValidi(lista) {
    if (!Array.isArray(lista) || lista.filter(p => p && p.ruolo !== "terzo").length < 3) return null;
    return lista.filter(p => p && p.id && p.tratti).map(p => ({ esasperazione: 1, ...p, tratti: { ...Object.fromEntries(M.TRATTI.map(k => [k, 0.5])), ...p.tratti } }));
  }
  let personaggi = personaggiValidi(salvati.personaggi) || predefiniti();
  const salvaPersonaggi = () => salva({ personaggi });
  const opz = () => ({ personaggi });
  const terzoPg = () => personaggi.find(p => p.ruolo === "terzo") || M.PERSONAGGI.find(p => p.ruolo === "terzo");

  const LIV_DOMANDA = Object.fromEntries(Object.entries(M.DOMANDE).flatMap(([k, v]) => v.map(d => [d.id, +k])));
  const COLORE_LIVELLO = l => (l <= 1 ? "verde" : l <= 4 ? "giallo" : "rosso");

  const stato = {
    vista: "gioco",
    seed: null, situazione: null, percorso: [], livello: 0, voti: [], finito: false,
    votato: false, bozza: {}, costruita: null, registrata: false,
  };
  const storico = () => stato.percorso.slice(0, stato.livello + 1);
  const passoCorrente = () => stato.percorso[stato.livello];

  function nuovoSeed() {
    return 100000 + Math.floor(Math.random() * 900000);
  }

  function avviaSituazione(sit, { seed = sit.seed, costruita = null } = {}) {
    Object.assign(stato, {
      vista: "gioco", seed, situazione: sit, percorso: M.simulaPercorso(sit, opz()),
      livello: 0, voti: [], finito: false, votato: false, bozza: {}, costruita, registrata: false,
    });
  }

  function nuova(seed = nuovoSeed()) {
    seed = Math.max(1, Math.floor(+seed) || 1);
    avviaSituazione(M.generaSituazione(seed, opz()), { seed });
    imposta(`#s-${seed}`);
    render();
    annunciaPasso();
  }

  function avviaCostruita(params) {
    const seed = nuovoSeed();
    avviaSituazione(M.costruisciSituazione({ ...params, seed }, opz()), { seed, costruita: params });
    imposta("#gioco");
    render();
    annunciaPasso();
  }

  function rigioca() {
    if (stato.costruita) {
      avviaSituazione(M.costruisciSituazione({ ...stato.costruita, seed: stato.seed }, opz()), { seed: stato.seed, costruita: stato.costruita });
      render();
      annunciaPasso();
    } else nuova(stato.seed);
  }

  function avanti() {
    if (!stato.situazione || stato.finito) return;
    if (stato.livello < stato.percorso.length - 1) {
      stato.livello++;
      stato.votato = false;
      stato.bozza = {};
      render();
      annunciaPasso();
    } else {
      stato.finito = true;
      registraPartita();
      render();
      annuncia("Fine dei giochi. Ecco la sentenza.");
      $("[data-testid=finale]")?.focus();
    }
  }

  function vota(risposte = {}) {
    if (!stato.situazione || stato.finito) return;
    const lv = stato.livello;
    const perche = typeof risposte.perche === "string" ? risposte.perche.slice(0, 140) : "";
    stato.voti = stato.voti.filter(v => v.livello !== lv);
    for (const d of M.domande(lv, stato.situazione)) {
      if (risposte[d.id] === undefined) continue;
      const valore = d.tipo === "scala" ? +risposte[d.id] : String(risposte[d.id]);
      stato.voti.push({ livello: lv, domanda: d.id, valore, ...(perche ? { perche } : {}) });
    }
    stato.votato = true;
    render();
  }

  function registraPartita() {
    if (stato.registrata || !stato.voti.length) return;
    stato.registrata = true;
    const sim = M.somiglianza(stato.voti, stato.situazione, stato.percorso, personaggi);
    const tot = { ...(salvati.somiglianza || {}) };
    for (const s of sim) if (s.distanza != null) {
      const prev = tot[s.id] || { d: 0, n: 0 };
      tot[s.id] = { d: +(prev.d + s.distanza).toFixed(3), n: prev.n + 1 };
    }
    const voce = { seed: stato.costruita ? null : stato.seed, quando: new Date().toISOString(), luogo: stato.situazione.luogo.id, condotta: stato.situazione.condotta.id, esito: stato.percorso.at(-1).esito, etichetta: M.etichettaCaso(stato.voti, stato.situazione, stato.percorso, personaggi), voti: stato.voti };
    const storicoPartite = [voce, ...(Array.isArray(salvati.storico) ? salvati.storico : [])].slice(0, 50);
    salva({ somiglianza: tot, partite: (salvati.partite || 0) + 1, storico: storicoPartite });
  }

  let annunciTimer;
  function annuncia(testo) {
    const el = $("[data-testid=annunci]");
    el.textContent = "";
    clearTimeout(annunciTimer);
    annunciTimer = setTimeout(() => { el.textContent = testo; }, 50);
  }
  function annunciaPasso() {
    const p = passoCorrente();
    if (!p) return;
    const nomi = nomeChi();
    annuncia(`Livello ${p.livello}, ${p.nome}. ` + p.testi.map(t => (t.chi === "narratore" ? "" : `${nomi(t.chi)} dice: `) + M.testoPiano(t.testo)).join(" "));
  }

  let toastTimer;
  function toast(testo) {
    const el = $("[data-testid=toast]");
    el.textContent = testo;
    el.classList.add("visibile");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("visibile"), 2600);
  }

  async function condividi() {
    const url = `${location.origin}${location.pathname}#s-${stato.seed}`;
    try {
      await navigator.clipboard.writeText(url);
      toast("Link copiato. Ora fai litigare qualcuno.");
    } catch {
      toast(`Copia questo link: ${url}`);
    }
  }

  function imposta(hash) {
    if (location.hash !== hash) history.replaceState(null, "", hash);
  }

  const VISTE = ["gioco", "laboratorio", "indovina", "costruisci", "personaggi"];
  function router() {
    const h = location.hash.slice(1);
    const m = h.match(/^s-(\d+)$/);
    if (m) {
      if (+m[1] !== stato.seed || stato.costruita || stato.vista !== "gioco") nuova(+m[1]);
      else { stato.vista = "gioco"; render(); }
      return;
    }
    stato.vista = VISTE.includes(h) ? h : "gioco";
    if (stato.vista === "gioco" && stato.situazione && !stato.costruita) imposta(`#s-${stato.seed}`);
    render();
  }

  const nomeChi = (s = stato.situazione) => {
    const mappa = Object.fromEntries([s.autore, s.osservatore, ...s.amici].map(p => [p.id, p.nome]));
    return chi => (chi === "terzo" ? cap(s.terzo || "il terzo") : chi === "folla" ? "Qualcuno tra il pubblico" : mappa[chi] || chi);
  };
  const cap = s => s[0].toUpperCase() + s.slice(1);

  function testoHTML(testo, sit) {
    return M.segmenti(testo).map(seg => {
      if (seg.tipo === "testo") return esc(seg.testo);
      const etichetta = { bestemmia: ["#@§!", "⚡ BIIP", "CENSURATO"][seg.intensita - 1], parolaccia: "#@!", insulto: "BIIP" }[seg.parola];
      const alt = { bestemmia: `bestemmia censurata, intensità ${seg.intensita}`, parolaccia: "parolaccia censurata", insulto: "insulto censurato" }[seg.parola];
      const aureola = sit?.luogo.id === "sagrato" && seg.parola === "bestemmia" ? " aureola" : "";
      return `<span class="censura${aureola}" data-testid="censura" data-parola="${seg.parola}" data-intensita="${seg.intensita}" role="img" aria-label="${alt}">${etichetta}</span>`;
    }).join("");
  }

  function fumettiHTML(sit, passo) {
    const pos = A.posizioni(sit, passo);
    const nomi = nomeChi(sit);
    let k = 0;
    return passo.testi.map(t => {
      const contenuto = `<span class="chi">${esc(nomi(t.chi))}</span><span class="testo">${testoHTML(t.testo, sit)}</span>`;
      if (t.chi === "narratore") return `<div class="fumetto-pos narr"><p class="fumetto" data-testid="fumetto" data-tipo="narratore" data-chi="narratore">${contenuto}</p></div>`;
      const x = pos[t.chi] ?? 400;
      const sinistra = x < 410;
      const tx = t.chi === "folla" ? "-50%" : sinistra ? "-24%" : "-76%";
      const bottom = 54 + k++ * 17;
      return `<div class="fumetto-pos" style="left:${(x / 8).toFixed(1)}%;bottom:${bottom}%;--tx:translateX(${tx})"><p class="fumetto" data-testid="fumetto" data-tipo="${t.tipo}" data-chi="${esc(t.chi)}" style="--coda:${t.chi === "folla" ? 46 : sinistra ? 20 : 74}%">${contenuto}</p></div>`;
    }).join("");
  }

  function scenaHTML(sit, passo) {
    return `<div class="scena-box" data-testid="scena"><div class="scena-svg">${A.scena(sit, passo, terzoPg())}</div><div class="fumetti">${fumettiHTML(sit, passo)}</div></div>`;
  }

  function semaforoHTML() {
    const p = passoCorrente();
    return `<ol class="semaforo" aria-label="Semaforo dell'escalation">${M.LIVELLI.map((nome, i) => {
      const accesa = !!stato.situazione && i <= stato.livello;
      const corrente = accesa && i === stato.livello;
      const cede = corrente && p?.fine && p?.cede;
      return `<li class="luce${corrente ? " corrente" : ""}${cede ? " cede" : ""}" data-testid="semaforo-luce" data-livello="${i}" data-accesa="${accesa}" data-colore="${COLORE_LIVELLO(i)}" aria-label="Livello ${i}: ${nome}${corrente ? " (attuale)" : accesa ? " (superato)" : ""}"${corrente ? ' aria-current="step"' : ""}>${i}</li>`;
    }).join("")}</ol>`;
  }

  function variabiliHTML(sit) {
    const m = sit.modulatori, L = sit.luogo, MO = M.MODULATORI;
    const allont = L.allontanarsi >= 0.8 ? "facile andarsene" : L.allontanarsi >= 0.4 ? "andarsene si può" : L.allontanarsi > 0 ? "difficile andarsene" : "impossibile andarsene";
    const chips = [
      ["luogo", "luogo", "Luogo", L.nome],
      ["condotta", "condotta", "Condotta", sit.condotta.nome],
      ["volume", "volume", "Volume", MO.volume.valori[m.volume]],
      ["frequenza", "frequenza", "Frequenza", MO.frequenza.valori[m.frequenza]],
      ["intento", "intento", "Intento", m.intento],
      ["bambini", "bambini", "Bambini", MO.bambini.valori[m.bambini]],
      ["allontanarsi", "allontanarsi", "Uscita", allont],
      ["terzo", "terzo", "Terzo", sit.terzo ? `c'è ${sit.terzo}` : "nessuno"],
      ["pubblico", "pubblico", "Pubblico", MO.pubblico.valori[m.pubblico]],
      ["durata", "durata", "Durata", L.durata >= 0.8 ? "lunga" : L.durata >= 0.4 ? "media" : "breve"],
    ];
    return `<ul class="variabili" aria-label="Variabili attive">${chips.map(([nome, ic, et, val]) => `<li class="chip" data-testid="variabile" data-nome="${nome}" title="${esc(et)}: ${esc(val)}">${A.icona(ic)}<span class="nome">${esc(et)}:</span> <b>${esc(val)}</b></li>`).join("")}</ul>`;
  }

  const pgPerId = id => personaggi.find(p => p.id === id);

  function lentiPer(livello, domandaId) {
    return M.lenti(stato.situazione, stato.percorso, livello, domandaId, personaggi);
  }

  function domandaHTML(d, livello, votoUtente, mostraLenti) {
    const scelto = votoUtente ?? stato.bozza[d.id];
    const lenti = mostraLenti ? lentiPer(livello, d.id) : [];
    const n = d.opzioni.length;
    return `<fieldset class="domanda" data-testid="voto-domanda" data-id="${d.id}" data-tipo="${d.tipo}">
      <legend>${esc(d.testo)}</legend>
      <div class="opzioni" data-tipo="${d.tipo}" style="--n:${n}" role="radiogroup" aria-label="${esc(d.testo)}">
        ${d.opzioni.map(o => {
          const sel = scelto !== undefined && String(scelto) === String(o.valore);
          const chi = lenti.filter(l => String(l.valore) === String(o.valore));
          return `<div class="opzione-col">
            <button type="button" class="opzione" role="radio" aria-checked="${sel}" data-testid="voto-opzione" data-azione="opzione" data-domanda="${d.id}" data-valore="${esc(o.valore)}"${votoUtente !== undefined ? " disabled" : ""}>${esc(o.etichetta)}</button>
            ${mostraLenti ? `${sel ? '<span class="tu">▲ tu</span>' : ""}<div class="lenti-col">${chi.map(l => {
              const p = pgPerId(l.id);
              return `<span class="lente" data-testid="lente" data-id="${l.id}" data-valore="${esc(l.valore)}" title="${esc(p.nome)}: «${esc(p.lente)}»" role="img" aria-label="${esc(p.nome)} voterebbe ${esc(o.etichetta)}">${A.miniSVG(p)}</span>`;
            }).join("")}</div>` : ""}
          </div>`;
        }).join("")}
      </div>
      ${d.tipo === "scala" ? `<div class="estremi"><span>1 · ${esc(d.estremi[0])}</span><span>5 · ${esc(d.estremi[1])}</span></div>` : ""}
    </fieldset>`;
  }

  function pannelloVotoHTML() {
    const lv = stato.livello, sit = stato.situazione;
    const ds = M.domande(lv, sit);
    const voti = Object.fromEntries(stato.voti.filter(v => v.livello === lv).map(v => [v.domanda, v.valore]));
    const perche = stato.voti.find(v => v.livello === lv && v.perche)?.perche || "";
    const completo = ds.every(d => stato.bozza[d.id] !== undefined);
    const ultimo = lv === stato.percorso.length - 1;
    const legenda = stato.votato ? `<ul class="legenda-lenti" aria-label="Le lenti dei personaggi">${M.principali(personaggi).map(p => `<li title="«${esc(p.lente)}»">${A.miniSVG(p)} ${esc(p.nome)}</li>`).join("")}</ul>` : "";
    return `<section class="scheda" data-testid="voto-pannello" data-livello="${lv}" data-colore="${COLORE_LIVELLO(lv)}" aria-labelledby="titolo-voto">
      <h2 id="titolo-voto">${stato.votato ? "Il tuo voto e le lenti" : "Il tuo voto"}</h2>
      ${legenda}
      ${ds.map(d => domandaHTML(d, lv, stato.votato ? voti[d.id] : undefined, stato.votato)).join("")}
      ${CHIEDI_PERCHE ? `      <div class="perche">
        <label for="perche">Perché? <span class="nota">(facoltativo)</span></label>
        <input id="perche" type="text" maxlength="140" data-testid="voto-perche" value="${esc(perche)}" ${stato.votato ? "disabled" : ""} placeholder="In 140 caratteri, come un vecchio tweet">
        <span class="contatore" data-contatore>${perche.length}/140</span>
      </div>` : ""}
      <div class="riga-azioni">
        ${stato.votato
          ? `<p class="nota" data-testid="voto-confermato">${vicinanzaTesto(lv)}</p>`
          : `<button type="button" class="btn btn-sec" data-azione="vota" data-testid="btn-vota"${completo ? "" : " disabled"}>Emetti il voto</button>`}
        <button type="button" class="btn btn-grande" data-azione="avanti" data-testid="btn-avanti">
          <span class="freccia" aria-hidden="true">${ultimo ? "⚖" : "➜"}</span><span>${ultimo ? "La sentenza" : "E poi?"}<small>${ultimo ? "Vai alla schermata finale" : "Cosa succede dopo"}</small></span>
        </button>
      </div>
    </section>`;
  }

  function vicinanzaTesto(lv) {
    const voti = stato.voti.filter(v => v.livello === lv);
    if (!voti.length) return "";
    const s = M.somiglianza(voti, stato.situazione, stato.percorso, personaggi);
    const vicini = s.filter(x => x.distanza === s[0].distanza).map(x => x.nome);
    return `A questo livello la pensi come ${vicini.join(", ")}.`;
  }

  const BATTUTE_SOMIGLIANZA = {
    marco: "Diplomatico. Probabilmente chiedi scusa anche ai lampioni.",
    luca: "Credi nel dialogo. E forse anche in altro.",
    gigi: "Hai già chiamato il gestore, vero?",
    sara: "Non stavi parlando con loro, e si vede.",
    ettore: "Il prete del quartiere ti saluta. Dall'altra parte della strada.",
  };

  function finaleHTML() {
    const sit = stato.situazione, percorso = stato.percorso;
    const nomi = nomeChi();
    const et = M.etichettaCaso(stato.voti, sit, percorso, personaggi);
    const sim = M.somiglianza(stato.voti, sit, percorso, personaggi);
    const tot = salvati.somiglianza || {};
    const medie = M.principali(personaggi).map(p => ({ p, m: tot[p.id]?.n ? tot[p.id].d / tot[p.id].n : null })).filter(x => x.m != null).sort((a, b) => a.m - b.m);
    const top = stato.voti.length ? pgPerId(sim[0].id) : null;
    const richiestaFatta = percorso.length >= 3;
    const domandeVotate = stato.voti.map(v => v.domanda);
    const tutteDomande = Object.values(M.DOMANDE).flat().filter(d => domandeVotate.includes(d.id));
    const compilata = id => M.domande(LIV_DOMANDA[id], sit).find(x => x.id === id);
    const etichettaValore = (d, v) => {
      if (v === undefined || v === null) return "–";
      if (d.tipo === "scala") return String(v);
      if (d.tipo === "oggetto") return v === "identita" ? "Identità" : "Condotta";
      const o = compilata(d.id).opzioni.find(o => String(o.valore) === String(v));
      return o ? o.etichetta.replace(/^([AB]) · .*/, "$1") : String(v);
    };
    return `<section class="finale" data-testid="finale" tabindex="-1" aria-labelledby="titolo-finale">
      <h2 id="titolo-finale" class="sr-only">Schermata finale</h2>
      <p class="timbro" aria-label="Sentenza numero ${stato.seed}">Sentenza n. ${stato.seed}</p>
      <p class="etichetta" data-testid="finale-etichetta">${esc(cap(et))}.</p>
      ${sit.identita && richiestaFatta ? `<div class="avviso-identita" data-testid="finale-identita" role="note"><strong>⚠ Attenzione:</strong> qui non si chiedeva di cambiare cosa fai, ma cosa sei. La richiesta riguardava un'identità (${esc(sit.condotta.nome.toLowerCase())}), non una condotta. Cambia tutto.</div>` : ""}
      <div class="somiglia" data-testid="finale-somiglianza">
        ${top ? `${A.avatarSVG(top, { espressione: "sollevato" })}<div><h3>In questa partita somigli a ${esc(top.nome)}</h3><p>${esc(BATTUTE_SOMIGLIANZA[top.id] || `«${top.lente}»`)}</p>${medie.length ? `<p class="nota">Nel totale delle partite (${salvati.partite || 0}) somigli di più a <b>${esc(medie[0].p.nome)}</b>.</p>` : ""}</div>`
          : `<div><h3>Nessun voto, nessuna somiglianza</h3><p>Hai guardato senza giudicare. Molto zen. O molto furbo.</p></div>`}
      </div>
      <div>
        <h3>Il percorso</h3>
        <ol class="percorso">${percorso.map(p => `<li><span class="n" data-colore="${p.fine && p.cede ? "verde" : COLORE_LIVELLO(p.livello)}">${p.livello}</span><div><b>${esc(p.nome)}</b>: ${esc(p.sintesi)}${p.testi.find(t => t.chi !== "narratore") ? ` <q>${esc(M.testoPiano(p.testi.find(t => t.chi !== "narratore").testo))}</q> <span class="nota">(${esc(nomi(p.testi.find(t => t.chi !== "narratore").chi))})</span>` : ""}</div></li>`).join("")}</ol>
      </div>
      ${tutteDomande.length ? `<div>
        <h3>I tuoi voti e le lenti</h3>
        <p class="nota">A = ${esc(sit.autore.nome)} · B = ${esc(sit.osservatore.nome)}. In verde i voti uguali al tuo.</p>
        <div class="tabella-wrap" tabindex="0" role="region" aria-label="Tabella dei voti a confronto"><table class="confronto" data-testid="finale-confronto">
          <thead><tr><th scope="col">Domanda</th><th scope="col">Tu</th>${M.principali(personaggi).map(p => `<th scope="col">${esc(p.nome)}</th>`).join("")}</tr></thead>
          <tbody>${tutteDomande.map(d => {
            const tuo = stato.voti.find(v => v.domanda === d.id);
            return `<tr><th scope="row">${esc(compilata(d.id).testo)}</th><td><b>${esc(etichettaValore(d, tuo?.valore))}</b>${tuo?.perche ? `<br><span class="nota">«${esc(tuo.perche)}»</span>` : ""}</td>${M.principali(personaggi).map(p => {
              const v = M.votoPrevisto(p, sit, d.id, percorso);
              return `<td class="${String(v) === String(tuo?.valore) ? "uguale" : ""}">${esc(etichettaValore(d, v))}${String(v) === String(tuo?.valore) ? " ✓" : ""}</td>`;
            }).join("")}</tr>`;
          }).join("")}</tbody>
        </table></div>
      </div>` : ""}
      <div class="pulsanti">
        <button type="button" class="btn" data-azione="nuova" data-testid="btn-finale-nuova">Nuova grana</button>
        <button type="button" class="btn btn-sec" data-azione="rigioca" data-testid="btn-rigioca">Riapri il processo</button>
        <button type="button" class="btn btn-sec" data-azione="cambia-variabile" data-testid="btn-cambia-variabile">E se invece…?</button>
        ${stato.costruita ? "" : `<button type="button" class="btn btn-sec" data-azione="condividi" data-testid="btn-condividi">Fai litigare un amico</button>`}
      </div>
      <div class="riga-azioni"><span></span><button type="button" class="btn btn-grande" data-azione="avanti" data-testid="btn-avanti" aria-disabled="true"><span class="freccia" aria-hidden="true">■</span><span>Fine dei giochi<small>La scena è chiusa</small></span></button></div>
    </section>`;
  }

  function vistaGioco() {
    if (!stato.situazione) {
      return `${semaforoHTML()}<div class="colonna"><section class="intro" data-testid="intro">
        <span class="cartello">Tutto tranquillo. Per ora.</span>
        <h2>Benvenuto al tribunale del marciapiede</h2>
        <p>Una scena in un luogo pubblico, qualcuno che dà fastidio, qualcuno che chiede. Tu giudichi livello per livello, su piani separati: è lecito? È ragionevole? Sarebbe stato cortese?</p>
        <p>Poi scopri come avrebbero votato Marco, Luca, Gigi, Sara ed Ettore. Spoiler: non sono d'accordo.</p>
        <p class="seed" data-testid="seed"></p>
        <div class="pulsanti"><button type="button" class="btn btn-grande" data-azione="nuova" data-testid="btn-intro-nuova">Nuova grana</button><a class="btn btn-sec" href="#laboratorio">Prova il laboratorio</a></div>
      </section></div>`;
    }
    const sit = stato.situazione, p = passoCorrente();
    return `${semaforoHTML()}<div class="colonna">
      <div class="intestazione-scena">
        <h2 data-testid="livello-nome">Livello ${p.livello} · ${esc(p.nome)}</h2>
        <p class="seed" data-testid="seed">${stato.costruita ? "Caso costruito a mano" : `Caso #s-${stato.seed} <button type="button" data-azione="condividi" title="Copia il link a questo caso">copia link</button>`}</p>
      </div>
      ${scenaHTML(sit, p)}
      ${variabiliHTML(sit)}
      ${stato.finito ? finaleHTML() : pannelloVotoHTML()}
    </div>`;
  }

  const VISTE_HTML = {
    gioco: vistaGioco,
    laboratorio: () => vistaLaboratorio(),
    indovina: () => vistaIndovina(),
    costruisci: () => vistaCostruisci(),
    personaggi: () => vistaPersonaggi(),
  };

  function render() {
    const focusKey = document.activeElement?.dataset?.testid;
    main.classList.toggle("senza-semaforo", stato.vista !== "gioco");
    main.innerHTML = VISTE_HTML[stato.vista]();
    for (const a of $$("nav.modi a")) {
      if (a.dataset.vista === stato.vista) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    }
    if (focusKey) {
      const el = $(`[data-testid="${focusKey}"]`);
      if (el && !el.disabled) el.focus({ preventScroll: true });
    }
  }

  const TEMI = ["auto", "light", "dark"];
  const NOMI_TEMA = { auto: "Auto", light: "Chiaro", dark: "Scuro" };
  function applicaTema(t) {
    if (t === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.dataset.theme = t;
    $("[data-tema-etichetta]").textContent = NOMI_TEMA[t];
  }

  function paramsDaSituazione(sit) {
    const m = sit.modulatori, r = sit.richiesta;
    return {
      luogo: sit.luogo.id, condotta: sit.condotta.id, autore: sit.autore.id, osservatore: sit.osservatore.id, amici: sit.amici.map(a => a.id),
      volume: m.volume, frequenza: m.frequenza, intento: m.intento, destinatario: m.destinatario, bambini: m.bambini,
      rapporto: m.rapporto, religione: m.religione, pubblico: m.pubblico, stile: r.stile, forma: r.forma, motivazione: r.motivazione,
    };
  }

  const AZIONI = {
    nuova: () => nuova(),
    avanti: () => avanti(),
    rigioca: () => rigioca(),
    condividi: () => condividi(),
    "cambia-variabile": () => {
      AZIONI_ESTERNE.prefill?.(paramsDaSituazione(stato.situazione));
      location.hash = "#costruisci";
    },
    tema: () => {
      const t = TEMI[(TEMI.indexOf(salvati.tema || "auto") + 1) % TEMI.length];
      salva({ tema: t });
      applicaTema(t);
      toast(`Tema: ${NOMI_TEMA[t].toLowerCase()}`);
    },
    opzione: el => {
      const d = el.dataset.domanda;
      const tipo = el.closest("[data-tipo]").dataset.tipo;
      stato.bozza[d] = tipo === "scala" ? +el.dataset.valore : el.dataset.valore;
      for (const b of $$(`[data-azione=opzione][data-domanda="${d}"]`)) b.setAttribute("aria-checked", String(b === el));
      const ds = M.domande(stato.livello, stato.situazione);
      const btn = $("[data-testid=btn-vota]");
      if (btn) btn.disabled = !ds.every(x => stato.bozza[x.id] !== undefined);
    },
    vota: () => {
      const perche = $("[data-testid=voto-perche]")?.value || "";
      vota({ ...stato.bozza, perche });
      $("[data-testid=btn-avanti]")?.focus();
    },
  };
  const AZIONI_ESTERNE = {};

  const editor = { sel: null };
  const PELLI = ["#F1D3B8", "#E0B48F", "#C08A63", "#8E5C3C", "#5E3B26"];
  const CORPI = ["esile", "media", "robusta"];
  const NOMI_DISTINTIVI = { maglione: "Maglione", giacca: "Giacca", cappello: "Cappello", occhiali: "Occhiali", giubbotto: "Giubbotto", foulard: "Foulard", kufi: "Kufi e barba", passeggino: "Passeggino", cuffie: "Cuffie", mascherina: "Mascherina", occhiali_sole: "Occhiali da sole", badge: "Badge e cravatta", nessuno: "Nessuno" };
  const idPredefiniti = new Set(M.PERSONAGGI.map(p => p.id));
  const pgSelezionato = () => pgPerId(editor.sel) || personaggi[0];

  function idUnico(base) {
    let n = 2, id = `${base}-${n}`;
    while (pgPerId(id)) id = `${base}-${++n}`;
    return id;
  }

  function votoEsempio(p) {
    const sit = M.costruisciSituazione({}, opz());
    return M.votoPrevisto(p, sit, "richiesta_ragionevole", []);
  }

  function anteprimaHTML(p) {
    return ["calmo", "infastidito", "arrabbiato"].map(e => A.avatarSVG(p, { espressione: e })).join("");
  }

  function vistaPersonaggi() {
    const p = pgSelezionato();
    editor.sel = p.id;
    const eliminabile = !idPredefiniti.has(p.id) && personaggi.filter(x => x.ruolo !== "terzo").length > 3;
    const opzioni = (lista, valore) => lista.map(([v, et]) => `<option value="${esc(v)}"${String(v) === String(valore) ? " selected" : ""}>${esc(et)}</option>`).join("");
    const av = { corpo: 1, distintivo: "nessuno", colore: "#888888", pelle: PELLI[1], capelli: "#3B2A20", taglio: "corti", ...p.avatar };
    return `<div class="colonna">
      <div class="intestazione-scena"><h2>Personaggi</h2><p class="nota">Archetipi di posizione, non caricature. Cambia i tratti e guarda come cambiano voti e lenti.</p></div>
      <div class="griglia-2">
        <section aria-labelledby="titolo-elenco">
          <h3 id="titolo-elenco">Il cast</h3>
          <div class="schede-pg" data-testid="editor-elenco">${personaggi.map(x => `<button type="button" class="scheda-pg" data-testid="editor-personaggio" data-id="${esc(x.id)}" data-azione="seleziona-pg" aria-pressed="${x.id === p.id}">${A.avatarSVG(x)}<b data-nome-di="${esc(x.id)}">${esc(x.nome)}</b><span class="titolo">${esc(x.titolo || "")}${x.principale ? " · lente" : ""}${x.ruolo === "terzo" ? " · arbitro" : ""}</span></button>`).join("")}</div>
          <div class="pulsanti" style="margin-top:12px">
            <button type="button" class="btn btn-sec" data-azione="pg-nuovo" data-testid="editor-nuovo">+ Nuovo personaggio</button>
            <button type="button" class="btn btn-sec" data-azione="pg-ripristina" data-testid="editor-ripristina">Ripristina predefiniti</button>
          </div>
        </section>
        <section class="scheda" data-testid="editor" aria-labelledby="titolo-editor" style="border-left-color:${esc(av.colore)}">
          <h3 id="titolo-editor" data-nome-di="${esc(p.id)}">${esc(p.nome)}</h3>
          <div class="anteprima" data-testid="editor-anteprima" aria-label="Anteprima di ${esc(p.nome)}">${anteprimaHTML(p)}</div>
          <p class="nota" data-testid="editor-esempio" style="margin-top:8px">Nel caso base del laboratorio troverebbe la richiesta ragionevole: <b>${votoEsempio(p)}/5</b>.</p>
          <div class="campi">
            <div class="campo"><label for="ed-nome">Nome</label><input id="ed-nome" type="text" maxlength="30" data-editor="nome" data-testid="editor-nome" value="${esc(p.nome)}"></div>
            <div class="campo"><label for="ed-titolo">Titolo</label><input id="ed-titolo" type="text" maxlength="40" data-editor="titolo" value="${esc(p.titolo || "")}"></div>
            <div class="campo"><label for="ed-descr">Descrizione</label><textarea id="ed-descr" maxlength="400" data-editor="descrizione">${esc(p.descrizione || "")}</textarea></div>
            <div class="campo"><label for="ed-lente">Lente (come giudica)</label><input id="ed-lente" type="text" maxlength="120" data-editor="lente" data-testid="editor-lente" value="${esc(p.lente || "")}"></div>
            <h3 style="margin-top:8px">Tratti</h3>
            ${M.TRATTI.map(k => `<div class="cursore"><label for="ed-${k}">${esc(M.NOMI_TRATTI[k])}</label><input id="ed-${k}" type="range" min="0" max="1" step="0.01" value="${p.tratti[k]}" data-tratto="${k}" data-testid="editor-tratto"><output for="ed-${k}" data-out="${k}">${(+p.tratti[k]).toFixed(2)}</output></div>`).join("")}
            <div class="cursore"><label for="ed-esaspera">Esaspera (amplifica i tratti distintivi)</label><input id="ed-esaspera" type="range" min="0.5" max="1.5" step="0.05" value="${p.esasperazione ?? 1}" data-editor="esasperazione" data-testid="editor-esaspera"><output for="ed-esaspera" data-out="esasperazione">×${(+(p.esasperazione ?? 1)).toFixed(2)}</output></div>
            <h3 style="margin-top:8px">Aspetto</h3>
            <div class="campo"><label for="ed-corpo">Corporatura</label><select id="ed-corpo" data-avatar="corpo">${opzioni(CORPI.map((c, i) => [i, c]), av.corpo)}</select></div>
            <div class="campo"><label for="ed-dist">Elemento distintivo</label><select id="ed-dist" data-avatar="distintivo">${opzioni(A.DISTINTIVI.map(d => [d, NOMI_DISTINTIVI[d]]), av.distintivo)}</select></div>
            <div class="campo"><label for="ed-taglio">Capelli</label><select id="ed-taglio" data-avatar="taglio">${opzioni(A.TAGLI.map(t => [t, t]), av.taglio)}</select></div>
            <div class="campo"><label for="ed-pelle">Carnagione</label><select id="ed-pelle" data-avatar="pelle">${opzioni(PELLI.map((c, i) => [c, `tono ${i + 1}`]), av.pelle)}</select></div>
            <div class="campo"><label for="ed-colore">Colore vestito</label><input id="ed-colore" type="color" data-avatar="colore" value="${esc(av.colore)}"></div>
            <div class="campo"><label for="ed-capelli">Colore capelli</label><input id="ed-capelli" type="color" data-avatar="capelli" value="${esc(av.capelli)}"></div>
          </div>
          <div class="pulsanti" style="margin-top:16px">
            <button type="button" class="btn" data-azione="pg-duplica" data-testid="editor-duplica">Duplica</button>
            ${eliminabile ? `<button type="button" class="btn btn-sec" data-azione="pg-elimina" data-testid="editor-elimina">Elimina</button>` : ""}
          </div>
        </section>
      </div>
    </div>`;
  }

  function aggiornaEditorInPlace(p) {
    const ant = $("[data-testid=editor-anteprima]");
    if (ant) ant.innerHTML = anteprimaHTML(p);
    const card = $(`[data-testid=editor-personaggio][data-id="${CSS.escape(p.id)}"] svg`);
    if (card) card.outerHTML = A.avatarSVG(p);
    for (const el of $$(`[data-nome-di="${CSS.escape(p.id)}"]`)) el.textContent = p.nome;
    const es = $("[data-testid=editor-esempio] b");
    if (es) es.textContent = `${votoEsempio(p)}/5`;
  }

  function inputEditor(el) {
    const p = pgSelezionato();
    if (el.dataset.tratto) {
      p.tratti[el.dataset.tratto] = Math.min(1, Math.max(0, parseFloat(el.value) || 0));
      $(`[data-out="${el.dataset.tratto}"]`).textContent = p.tratti[el.dataset.tratto].toFixed(2);
    } else if (el.dataset.editor === "esasperazione") {
      p.esasperazione = Math.min(1.5, Math.max(0.5, parseFloat(el.value) || 1));
      $(`[data-out="esasperazione"]`).textContent = `×${p.esasperazione.toFixed(2)}`;
    } else if (el.dataset.editor) {
      p[el.dataset.editor] = el.value;
      if (el.dataset.editor === "nome" && !el.value.trim()) p.nome = "Senza nome";
    } else if (el.dataset.avatar) {
      p.avatar = { ...p.avatar, [el.dataset.avatar]: el.dataset.avatar === "corpo" ? +el.value : el.value };
    }
    salvaPersonaggi();
    aggiornaEditorInPlace(p);
  }

  const MO = M.MODULATORI;
  const LAB_VARIABILI = [
    { nome: "luogo", etichetta: "Luogo", opzioni: M.LUOGHI.map(l => [l.id, l.nome]) },
    { nome: "condotta", etichetta: "Condotta", opzioni: M.CONDOTTE.map(c => [c.id, c.nome]) },
    { nome: "volume", etichetta: "Volume", opzioni: MO.volume.valori.map((v, i) => [i, v]), numero: true },
    { nome: "frequenza", etichetta: "Frequenza", opzioni: MO.frequenza.valori.map((v, i) => [i, v]), numero: true },
    { nome: "intento", etichetta: "Intento", opzioni: MO.intento.valori.map(v => [v, v]) },
    { nome: "destinatario", etichetta: "Destinatario", opzioni: MO.destinatario.valori.map(v => [v, v]) },
    { nome: "bambini", etichetta: "Bambini", opzioni: MO.bambini.valori.map((v, i) => [i, v]), numero: true },
    { nome: "rapporto", etichetta: "Rapporto tra le parti", opzioni: MO.rapporto.valori.map(v => [v, v]) },
    { nome: "pubblico", etichetta: "Pubblico", opzioni: MO.pubblico.valori.map((v, i) => [i, v]), numero: true },
    { nome: "stile", etichetta: "Stile della richiesta", opzioni: M.STILI.map(v => [v, v]) },
    { nome: "forma", etichetta: "Forma della richiesta", opzioni: M.FORME.map(v => [v, v]) },
    { nome: "motivazione", etichetta: "Motivazione dichiarata", opzioni: M.MOTIVAZIONI.map(v => [v, v]) },
  ];
  const lab = { attiva: null, params: { ...M.CASO_BASE }, voti: {} };
  const varLab = nome => LAB_VARIABILI.find(v => v.nome === nome);
  const chiaveLab = () => (lab.attiva ? String(lab.params[lab.attiva]) : "base");

  function situazioneLab(params = lab.params) {
    const sit = M.costruisciSituazione({ ...params, seed: 1 }, opz());
    const passi = M.simulaPercorso(sit, { ...opz(), forza: { 1: "chiede" } });
    return { sit, passi };
  }

  function scenaLab() {
    const { sit, passi } = situazioneLab();
    const p2 = passi[2];
    const passo = { ...p2, testi: [passi[0].testi[1], p2.testi[0]] };
    return { sit, passi, html: `<div class="scena-box fumetti-sotto" data-testid="lab-scena"><div class="scena-svg">${A.scena(sit, passo, terzoPg())}</div><div class="fumetti">${fumettiHTML(sit, passo)}</div></div>` };
  }

  function lentiLab(params) {
    const { sit, passi } = situazioneLab(params);
    return M.lenti(sit, passi, 2, "richiesta_ragionevole", personaggi);
  }

  function graficoLab() {
    const W = 680, H = 300, ml = 40, mr = 16, mt = 16, mb = 86;
    const v = lab.attiva ? varLab(lab.attiva) : null;
    const xs = v ? v.opzioni : [["base", "caso base"]];
    const passo = (W - ml - mr) / Math.max(1, xs.length - 1 || 1);
    const X = i => (xs.length === 1 ? (W - ml - mr) / 2 + ml : ml + i * passo);
    const Y = val => mt + (5 - val) * (H - mt - mb) / 4;
    const linee = M.principali(personaggi).map(p => {
      const punti = xs.map(([val], i) => {
        const params = v ? { ...lab.params, [v.nome]: v.numero ? +val : val } : lab.params;
        return [X(i), Y(lentiLab(params).find(l => l.id === p.id).valore)];
      });
      return { p, punti };
    });
    const miei = xs.map(([val], i) => [i, lab.voti[String(val)]]).filter(([, y]) => y != null);
    const off = (k, n) => (k - (n - 1) / 2) * 3;
    return `<figure class="grafico" data-testid="lab-grafico" data-punti="${miei.length}">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafico: il tuo voto di ragionevolezza${v ? ` al variare di ${esc(v.etichetta.toLowerCase())}` : ""}, confrontato con le lenti">
        ${[1, 2, 3, 4, 5].map(y => `<line x1="${ml}" x2="${W - mr}" y1="${Y(y)}" y2="${Y(y)}" stroke="currentColor" stroke-opacity=".15"/><text x="${ml - 10}" y="${Y(y) + 5}" text-anchor="end" font-size="13">${y}</text>`).join("")}
        ${xs.map(([, et], i) => `<text transform="translate(${X(i)} ${H - mb + 18}) rotate(${xs.length > 4 ? -35 : 0})" text-anchor="${xs.length > 4 ? "end" : "middle"}" font-size="12">${esc(et.length > 18 ? et.slice(0, 17) + "…" : et)}</text>`).join("")}
        ${linee.map(({ p, punti }, k) => `<polyline points="${punti.map(([x, y]) => `${x},${y + off(k, linee.length)}`).join(" ")}" fill="none" stroke="${esc(p.avatar?.colore || "#888")}" stroke-width="2.5" stroke-opacity=".85" stroke-dasharray="${k % 2 ? "6 4" : "none"}"/>`).join("")}
        ${linee.map(({ p, punti }, k) => punti.map(([x, y]) => `<circle cx="${x}" cy="${y + off(k, linee.length)}" r="3.5" fill="${esc(p.avatar?.colore || "#888")}"/>`).join("")).join("")}
        ${miei.length > 1 ? `<polyline points="${miei.map(([i, y]) => `${X(i)},${Y(y)}`).join(" ")}" fill="none" stroke="currentColor" stroke-width="4"/>` : ""}
        ${miei.map(([i, y]) => `<circle cx="${X(i)}" cy="${Y(y)}" r="7" fill="var(--giallo)" stroke="currentColor" stroke-width="3"/>`).join("")}
      </svg>
      <figcaption><ul class="legenda-lenti"><li><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6" fill="var(--giallo)" stroke="currentColor" stroke-width="3"/></svg> Tu</li>${linee.map(({ p }, k) => `<li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12 H22" stroke="${esc(p.avatar?.colore || "#888")}" stroke-width="3" stroke-dasharray="${k % 2 ? "5 3" : "none"}"/></svg>${esc(p.nome)}</li>`).join("")}</ul>
      ${v ? "" : `<p class="nota">Cambia una variabile per vedere come si sposta il giudizio.</p>`}</figcaption>
    </figure>`;
  }

  function vistaLaboratorio() {
    const { html } = scenaLab();
    const chiave = chiaveLab();
    const mio = lab.voti[chiave];
    const lenti = lentiLab(lab.params);
    const v = lab.attiva ? varLab(lab.attiva) : null;
    const valoreAttuale = v ? v.opzioni.find(([val]) => String(val) === String(lab.params[v.nome]))?.[1] : null;
    return `<div class="colonna">
      <div class="intestazione-scena"><h2>Laboratorio</h2><p class="nota">Caso base: due adulti al parco, uno bestemmia una volta, uno sconosciuto chiede gentilmente. Cambia <b>una sola</b> variabile e vota di nuovo.</p></div>
      <div class="griglia-2">
        <div class="colonna">
          ${html}
          <section class="scheda" data-colore="giallo" aria-labelledby="titolo-lab-voto" data-testid="lab-voto">
            <h3 id="titolo-lab-voto">È ragionevole questa richiesta?${v ? ` <span class="nota">(${esc(v.etichetta.toLowerCase())}: ${esc(valoreAttuale)})</span>` : ""}</h3>
            <div class="opzioni" data-tipo="scala" style="--n:5" role="radiogroup" aria-label="È ragionevole questa richiesta?">
              ${[1, 2, 3, 4, 5].map(n => `<div class="opzione-col"><button type="button" class="opzione" role="radio" aria-checked="${mio === n}" data-azione="lab-vota" data-testid="lab-opzione" data-valore="${n}">${n}</button>
                ${mio != null ? `${mio === n ? '<span class="tu">▲ tu</span>' : ""}<div class="lenti-col">${lenti.filter(l => l.valore === n).map(l => { const p = pgPerId(l.id); return `<span class="lente" data-testid="lente" data-id="${l.id}" title="${esc(p.nome)}: «${esc(p.lente)}»" role="img" aria-label="${esc(p.nome)} voterebbe ${n}">${A.miniSVG(p)}</span>`; }).join("")}</div>` : ""}</div>`).join("")}
            </div>
            <div class="estremi"><span>1 · per niente</span><span>5 · del tutto</span></div>
          </section>
          ${graficoLab()}
        </div>
        <section class="scheda" aria-labelledby="titolo-variabili" data-colore="verde">
          <h3 id="titolo-variabili">Variabili</h3>
          <p class="nota">${v ? `Stai esplorando <b>${esc(v.etichetta.toLowerCase())}</b>. Le altre sono bloccate.` : "Tocca una variabile: le altre si bloccano."}</p>
          <div class="campi">
            ${LAB_VARIABILI.map(x => `<div class="campo" data-testid="lab-variabile" data-nome="${x.nome}" data-attiva="${lab.attiva === x.nome}">
              <label for="lab-${x.nome}">${esc(x.etichetta)}</label>
              <select id="lab-${x.nome}" data-lab="${x.nome}"${lab.attiva && lab.attiva !== x.nome ? " disabled" : ""}>${x.opzioni.map(([val, et]) => `<option value="${esc(val)}"${String(val) === String(lab.params[x.nome]) ? " selected" : ""}>${esc(et)}${String(val) === String(M.CASO_BASE[x.nome]) ? " (base)" : ""}</option>`).join("")}</select>
            </div>`).join("")}
          </div>
          <div class="pulsanti" style="margin-top:16px"><button type="button" class="btn btn-sec" data-azione="lab-reset" data-testid="btn-lab-reset"${lab.attiva || Object.keys(lab.voti).length ? "" : " disabled"}>Cambia variabile</button></div>
        </section>
      </div>
    </div>`;
  }

  function cambiaLab(el) {
    const v = varLab(el.dataset.lab);
    if (!v || (lab.attiva && lab.attiva !== v.nome)) return;
    if (!lab.attiva) {
      lab.attiva = v.nome;
      if (lab.voti.base != null) lab.voti = { [String(M.CASO_BASE[v.nome])]: lab.voti.base };
    }
    lab.params = { ...lab.params, [v.nome]: v.numero ? +el.value : el.value };
    render();
    $(`[data-lab="${v.nome}"]`)?.focus();
  }

  Object.assign(AZIONI, {
    "lab-vota": el => {
      lab.voti[chiaveLab()] = +el.dataset.valore;
      render();
      $(`[data-testid=lab-opzione][data-valore="${el.dataset.valore}"]`)?.focus();
    },
    "lab-reset": () => {
      Object.assign(lab, { attiva: null, params: { ...M.CASO_BASE }, voti: {} });
      render();
      $("[data-lab]")?.focus();
    },
  });

  const costr = { params: { ...M.CASO_BASE, amici: [...M.CASO_BASE.amici] } };
  AZIONI_ESTERNE.prefill = p => { costr.params = { ...M.CASO_BASE, ...clona(p) }; };

  function campiCostruisci() {
    const pg = personaggi.filter(p => p.ruolo !== "terzo").map(p => [p.id, p.nome]);
    const am = costr.params.amici || [];
    return [
      { nome: "autore", etichetta: "Chi dà fastidio (A)", opzioni: pg, valore: costr.params.autore },
      { nome: "osservatore", etichetta: "Chi ascolta e forse chiede (B)", opzioni: pg, valore: costr.params.osservatore },
      { nome: "amico1", etichetta: "Amico di A", opzioni: [["", "nessuno"], ...pg], valore: am[0] || "" },
      { nome: "amico2", etichetta: "Secondo amico", opzioni: [["", "nessuno"], ...pg], valore: am[1] || "" },
      ...LAB_VARIABILI.map(v => ({ ...v, valore: costr.params[v.nome] })),
    ];
  }

  function vistaCostruisci() {
    const p = costr.params;
    const errore = p.autore === p.osservatore ? "A e B devono essere persone diverse." : "";
    const sit = M.costruisciSituazione({ ...p, seed: 1 }, opz());
    const P = M.probabilita(sit);
    const esiti = {};
    const N = 200;
    for (let s = 1; s <= N; s++) {
      const passi = M.simulaPercorso({ ...sit, seed: s }, opz());
      const u = passi.at(-1);
      const k = `${u.livello}·${u.esito}`;
      esiti[k] = (esiti[k] || 0) + 1;
    }
    const top = Object.entries(esiti).sort((a, b) => b[1] - a[1]).slice(0, 6);
    const barra = (et, v) => `<li><span>${esc(et)}</span><span class="barra" style="--v:${Math.round(v * 100)}%"><span></span></span><b>${Math.round(v * 100)}%</b></li>`;
    const passo0 = M.simulaPercorso(sit, opz())[0];
    return `<div class="colonna">
      <div class="intestazione-scena"><h2>Costruisci il caso</h2><p class="nota">Scegli tutto a mano, poi lascia girare il motore. Utile per preparare casi da discutere in live.</p></div>
      <div class="griglia-2">
        <div class="colonna">
          <div class="scena-box fumetti-sotto" data-testid="costruisci-anteprima"><div class="scena-svg">${A.scena(sit, passo0, terzoPg())}</div><div class="fumetti">${fumettiHTML(sit, passo0)}</div></div>
          <section class="scheda" data-colore="giallo" aria-labelledby="titolo-prob" data-testid="costruisci-probabilita">
            <h3 id="titolo-prob">Cosa dice il motore</h3>
            <ul class="barre">
              ${barra(`Fastidio percepito da ${sit.osservatore.nome}`, P.F)}
              ${barra("Probabilità che chieda", P.chiede)}
              ${barra(`Probabilità che ${sit.autore.nome} accetti`, P.accetta)}
              ${barra("Probabilità che insista dopo un no", P.insiste)}
            </ul>
            <h3 style="margin-top:12px">Come va a finire, su ${N} simulazioni</h3>
            <ul class="barre" data-testid="costruisci-esiti">${top.map(([k, n]) => { const [lv, e] = k.split("·"); return barra(`Livello ${lv} · ${M.ESITI[e]}`, n / N); }).join("")}</ul>
          </section>
        </div>
        <section class="scheda" data-colore="verde" aria-labelledby="titolo-costr">
          <h3 id="titolo-costr">Ingredienti</h3>
          <div class="campi">
            ${campiCostruisci().map(c => `<div class="campo" data-testid="costruisci-campo" data-nome="${c.nome}"><label for="co-${c.nome}">${esc(c.etichetta)}</label><select id="co-${c.nome}" data-costr="${c.nome}">${c.opzioni.map(([v, et]) => `<option value="${esc(v)}"${String(v) === String(c.valore) ? " selected" : ""}>${esc(et)}</option>`).join("")}</select></div>`).join("")}
          </div>
          ${errore ? `<p class="avviso-identita" role="alert" data-testid="costruisci-errore" style="margin-top:12px">${esc(errore)}</p>` : ""}
          <div class="pulsanti" style="margin-top:16px">
            <button type="button" class="btn btn-grande" data-azione="costruisci-avvia" data-testid="btn-costruisci-avvia"${errore ? " disabled" : ""}>Fai partire il caso</button>
            <button type="button" class="btn btn-sec" data-azione="costruisci-reset" data-testid="btn-costruisci-reset">Torna al caso base</button>
          </div>
        </section>
      </div>
    </div>`;
  }

  function cambiaCostruisci(el) {
    const nome = el.dataset.costr;
    const p = costr.params;
    if (nome === "amico1" || nome === "amico2") {
      const am = [...(p.amici || [])];
      am[nome === "amico1" ? 0 : 1] = el.value;
      p.amici = am.filter(Boolean);
    } else {
      const v = varLab(nome);
      p[nome] = v?.numero ? +el.value : el.value;
    }
    render();
    $(`[data-costr="${nome}"]`)?.focus();
  }

  Object.assign(AZIONI, {
    "costruisci-avvia": () => {
      const p = costr.params;
      if (p.autore === p.osservatore) return;
      avviaCostruita(clona(p));
      $("[data-testid=livello-nome]")?.scrollIntoView({ block: "start" });
    },
    "costruisci-reset": () => {
      costr.params = { ...M.CASO_BASE, amici: [...M.CASO_BASE.amici] };
      render();
    },
  });

  const ind = { caso: null, risposta: null };
  const DOMANDE_INDOVINA = [[2, "richiesta_ragionevole"], [2, "richiesta_lecita"], [1, "fastidio_comprensibile"], [0, "appropriata"]];

  function nuovoCasoIndovina(seed = nuovoSeed()) {
    const sit = M.generaSituazione(seed, opz());
    const passi = M.simulaPercorso(sit, { ...opz(), forza: { 1: "chiede" } });
    const rnd = M.mulberry32(seed ^ 0x2545f491);
    const pr = M.principali(personaggi);
    const pg = pr[Math.floor(rnd() * pr.length)];
    const [livello, domanda] = DOMANDE_INDOVINA[Math.floor(rnd() * DOMANDE_INDOVINA.length)];
    ind.caso = { seed, sit, passi, pgId: pg.id, livello, domanda };
    ind.risposta = null;
  }

  function vistaIndovina() {
    if (!ind.caso) nuovoCasoIndovina();
    const { sit, passi, pgId, livello, domanda } = ind.caso;
    const pg = pgPerId(pgId) || M.principali(personaggi)[0];
    const d = M.domande(livello, sit).find(x => x.id === domanda);
    const giusto = M.votoPrevisto(pg, sit, domanda, passi);
    const passo = { ...passi[2], testi: [passi[0].testi[1], passi[2].testi[0]] };
    const pt = salvati.indovina || { punti: 0, tentativi: 0, serie: 0 };
    const top = [...M.TRATTI].sort((a, b) => Math.abs(pg.tratti[b] - 0.5) - Math.abs(pg.tratti[a] - 0.5)).slice(0, 3);
    let esito = "";
    if (ind.risposta != null) {
      const scarto = d.tipo === "scala" ? Math.abs(+ind.risposta - +giusto) : String(ind.risposta) === String(giusto) ? 0 : 9;
      const punti = scarto === 0 ? 2 : scarto === 1 ? 1 : 0;
      const etichetta = v => d.opzioni.find(o => String(o.valore) === String(v))?.etichetta || v;
      esito = `<div class="scheda" data-colore="${punti === 2 ? "verde" : punti ? "giallo" : "rosso"}" data-testid="indovina-esito" data-punti="${punti}" role="status">
        <h3>${punti === 2 ? "Centrato. Leggi nel pensiero." : punti ? "Quasi. Ci sei vicino." : "Mancato. Mettiti nei suoi panni, anche se stretti."}</h3>
        <p>Hai detto <b>${esc(etichetta(ind.risposta))}</b>, ${esc(pg.nome)} direbbe <b>${esc(etichetta(giusto))}</b>.</p>
        <p class="nota">La sua lente: «${esc(pg.lente)}»</p>
        <button type="button" class="btn" data-azione="indovina-nuovo" data-testid="btn-indovina-nuovo">Altro caso</button>
      </div>`;
    }
    return `<div class="colonna">
      <div class="intestazione-scena"><h2>Indovina la lente</h2><p class="seed" data-testid="indovina-punteggio">Punti: ${pt.punti} · tentativi: ${pt.tentativi} · serie: ${pt.serie}</p></div>
      <div class="griglia-2">
        <div class="colonna">
          <div class="scena-box fumetti-sotto" data-testid="indovina-scena"><div class="scena-svg">${A.scena(sit, passo, terzoPg())}</div><div class="fumetti">${fumettiHTML(sit, passo)}</div></div>
          ${variabiliHTML(sit)}
        </div>
        <div class="colonna">
          <section class="somiglia" data-testid="indovina-personaggio" data-id="${esc(pg.id)}">
            ${A.avatarSVG(pg, { espressione: ind.risposta == null ? "perplesso" : "sollevato" })}
            <div><h3>${esc(pg.nome)}, ${esc(pg.titolo || "")}</h3><p>${esc(pg.descrizione || "")}</p><p class="nota">Tratti più marcati: ${top.map(k => `${esc(M.NOMI_TRATTI[k].toLowerCase())} ${(+pg.tratti[k]).toFixed(2)}`).join(" · ")}</p></div>
          </section>
          <section class="scheda" data-colore="giallo" aria-labelledby="titolo-indovina">
            <h3 id="titolo-indovina">Secondo te, come risponderebbe ${esc(pg.nome)}?</h3>
            <p><b>${esc(d.testo)}</b></p>
            <div class="opzioni" data-tipo="${d.tipo}" style="--n:${d.opzioni.length}" role="radiogroup" aria-label="${esc(d.testo)}">
              ${d.opzioni.map(o => `<button type="button" class="opzione" role="radio" aria-checked="${String(ind.risposta) === String(o.valore)}" data-azione="indovina-rispondi" data-testid="indovina-opzione" data-valore="${esc(o.valore)}"${ind.risposta != null ? " disabled" : ""}>${esc(o.etichetta)}</button>`).join("")}
            </div>
            ${d.tipo === "scala" ? `<div class="estremi"><span>1 · ${esc(d.estremi[0])}</span><span>5 · ${esc(d.estremi[1])}</span></div>` : ""}
          </section>
          ${esito}
        </div>
      </div>
    </div>`;
  }

  Object.assign(AZIONI, {
    "indovina-rispondi": el => {
      if (ind.risposta != null) return;
      const { sit, passi, pgId, livello, domanda } = ind.caso;
      const d = M.domande(livello, sit).find(x => x.id === domanda);
      ind.risposta = d.tipo === "scala" ? +el.dataset.valore : el.dataset.valore;
      const giusto = M.votoPrevisto(pgPerId(pgId), sit, domanda, passi);
      const scarto = d.tipo === "scala" ? Math.abs(ind.risposta - giusto) : String(ind.risposta) === String(giusto) ? 0 : 9;
      const punti = scarto === 0 ? 2 : scarto === 1 ? 1 : 0;
      const pt = salvati.indovina || { punti: 0, tentativi: 0, serie: 0 };
      salva({ indovina: { punti: pt.punti + punti, tentativi: pt.tentativi + 1, serie: punti === 2 ? pt.serie + 1 : 0 } });
      render();
      $("[data-testid=btn-indovina-nuovo]")?.focus();
    },
    "indovina-nuovo": () => {
      nuovoCasoIndovina();
      render();
      $("[data-testid=indovina-opzione]")?.focus();
    },
  });

  Object.assign(AZIONI, {
    "seleziona-pg": el => {
      editor.sel = el.dataset.id;
      render();
      const card = $(`[data-testid=editor-personaggio][data-id="${CSS.escape(el.dataset.id)}"]`);
      card?.focus({ preventScroll: true });
      if (matchMedia("(max-width: 900px)").matches) $("[data-testid=editor]")?.scrollIntoView({ block: "start" });
    },
    "pg-duplica": () => {
      const p = pgSelezionato();
      const copia = { ...clona(p), id: idUnico(p.id), nome: `${p.nome} (copia)`.slice(0, 30), principale: false, ruolo: undefined };
      delete copia.ruolo;
      delete copia.vincoli;
      personaggi.splice(personaggi.indexOf(p) + 1, 0, copia);
      editor.sel = copia.id;
      salvaPersonaggi();
      render();
      toast(`Creato ${copia.nome}.`);
    },
    "pg-nuovo": () => {
      const nuovo = {
        id: idUnico("nuovo"), nome: "Nuovo personaggio", titolo: "da definire", descrizione: "", lente: "Dipende.", esasperazione: 1, voce: null,
        tratti: Object.fromEntries(M.TRATTI.map(k => [k, 0.5])),
        avatar: { corpo: 1, distintivo: "nessuno", colore: "#6E8B3D", pelle: PELLI[2], capelli: "#2E2E2E", taglio: "corti" },
      };
      personaggi.push(nuovo);
      editor.sel = nuovo.id;
      salvaPersonaggi();
      render();
      $("[data-testid=editor-nome]")?.focus();
    },
    "pg-elimina": () => {
      const p = pgSelezionato();
      if (idPredefiniti.has(p.id) || personaggi.filter(x => x.ruolo !== "terzo").length <= 3) return;
      personaggi = personaggi.filter(x => x !== p);
      editor.sel = personaggi[0].id;
      salvaPersonaggi();
      render();
      toast(`${p.nome} è uscito di scena.`);
    },
    "pg-ripristina": () => {
      personaggi = predefiniti();
      editor.sel = personaggi[0].id;
      salva({ personaggi: undefined });
      render();
      toast("Cast ripristinato ai valori predefiniti.");
    },
  });


  document.addEventListener("click", e => {
    const el = e.target.closest("[data-azione]");
    if (!el || el.disabled || el.getAttribute("aria-disabled") === "true") return;
    const fn = AZIONI[el.dataset.azione];
    if (fn) { e.preventDefault(); fn(el); }
  });
  document.addEventListener("input", e => {
    if (e.target.closest("[data-testid=editor]") && (e.target.dataset.tratto || e.target.dataset.editor || e.target.dataset.avatar)) inputEditor(e.target);
    if (e.target.matches("[data-testid=voto-perche]")) {
      const c = $("[data-contatore]");
      if (c) c.textContent = `${e.target.value.length}/140`;
    }
  });
  document.addEventListener("change", e => {
    if (e.target.dataset.lab) cambiaLab(e.target);
    if (e.target.dataset.costr) cambiaCostruisci(e.target);
  });
  document.addEventListener("keydown", e => {
    const el = e.target.closest?.("[role=radio]");
    if (!el || !["ArrowRight", "ArrowLeft", "ArrowDown", "ArrowUp"].includes(e.key)) return;
    const gruppo = $$("[role=radio]", el.closest("[role=radiogroup]"));
    const i = gruppo.indexOf(el) + (["ArrowRight", "ArrowDown"].includes(e.key) ? 1 : -1);
    const next = gruppo[(i + gruppo.length) % gruppo.length];
    if (next && !next.disabled) { e.preventDefault(); next.focus(); next.click(); }
  });

  addEventListener("hashchange", router);
  applicaTema(salvati.tema || "auto");
  router();

  window.__CHR__ = {
    version: "1.0.0",
    stato: () => clona({ seed: stato.seed, situazione: stato.situazione, livello: stato.livello, storico: storico(), voti: stato.voti, finito: stato.finito, vista: stato.vista }),
    nuova,
    avanti,
    vota,
    generaSituazione: seed => M.generaSituazione(seed, opz()),
    simulaPercorso: seed => M.simulaPercorso(seed, opz()),
    testiPercorso: seed => M.testiPercorso(seed, opz()),
    lenti: (livello, domanda) => (stato.situazione ? lentiPer(livello, domanda).map(({ id, valore }) => ({ id, valore })) : []),
    get dati() {
      return { PERSONAGGI: personaggi, LUOGHI: M.LUOGHI, CONDOTTE: M.CONDOTTE, MODULATORI: M.MODULATORI, RICHIESTE: { STILI: M.STILI, FORME: M.FORME, MOTIVAZIONI: M.MOTIVAZIONI, CONCRETE: M.CONCRETE }, TEMPLATE: M.TEMPLATE };
    },
    storageKey: STORAGE_KEY,
    resetStorage() {
      storage.reset();
      salvati = {};
      personaggi = predefiniti();
      applicaTema("auto");
      render();
    },
    _interno: { stato, AZIONI, AZIONI_ESTERNE, VISTE_HTML, render, salva, storage, get personaggi() { return personaggi; }, set personaggi(v) { personaggi = v; }, salvaPersonaggi, toast, scenaHTML, avviaCostruita, paramsDaSituazione, pgPerId, opz, ind, nuovoCasoIndovina, costr },
  };
})();
</script>
</body>
</html>
